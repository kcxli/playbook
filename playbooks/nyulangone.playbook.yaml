version: 1
name: "NYU Langone Health Application"
job_id: "1158700_RR00117907"
employer_key: "nyulangone"
url: "https://jobs.silkroad.com/NYULangone/NYULHCareers/Apply/MultiForm/119818"

# Template paths reference the applicant data file:
#   person_name.*, address_and_contact.*, emails.*, documents.* come from the
#   rich profile; repeated application answers live under `app_answers.*`;
#   NYU-specific answers live under `answers.nyulangone_*`; `builtins.today`
#   is supplied by the runner.

steps:
  # --- accept terms modal, then fill form ---------------------------------
  - click: "ACCEPT"
    wait_after: 2
  - fill: "First Name"
    selector: "#FirstName.sr-form__input"
    value: "{{ person_name.legal_name.first }}"
  - fill: "Last Name"
    selector: "#LastName.sr-form__input"
    value: "{{ person_name.legal_name.last }}"
  - fill: "Email Address"
    selector: "#EmailAddress.sr-form__input"
    value: "{{ emails.institution_email }}"

  # --- resume upload -----------------------------------------------------
  - upload: "Resume / CV Upload"
    selector: "#File"
    value: "{{ documents.resume_path_or_url }}"

  # --- phone and address and how you heard about position -------------------------------------------------
  - fill: "Mobile Phone"
    selector: "#PrimaryPhoneNumber.sr-form__input"
    value: "{{ address_and_contact.phone_numbers.mobile }}"
  - check: "Terms of Service & Privacy Policy"
    selector: "#AcceptTermsAndPrivacy_0"
  - fill: "Address"
    selector: "#AddressLine1.sr-form__input"
    value: "{{ address_and_contact.primary_address.line_1 }}"
  - fill: "City"
    selector: "#City.sr-form__input"
    value: "{{ address_and_contact.primary_address.city }}"
    wait_after: 2
  - select: "State/Location"
    selector: "#State"
    value: "{{ address_and_contact.primary_address.state_province }}"
  - fill: "Postal Code"
    selector: "#PostalCode.sr-form__input"
    value: "{{ address_and_contact.primary_address.postal_code }}"
  - select: "How did you hear about NYU Langone?"
    selector: "#OriginalSource"
    value: "{{ app_answers.referral_source }}"
  - click: "NEXT"
    wait_after: 3

  # --- education, prev NYU experience -------------------------------------------------

  # Valid values: "Unknown" | "High School/Equivalent" | "Some College-No Degree" |
  # "2 Year Degree" | "3 Year Degree" | "4 Year University/College Degree" |
  # "Post Graduate Degree" | "Doctoral Degree"
  - select: "Highest Level of Education"
    selector: "#ResumeColumn4"
    value: "{{ app_answers.highest_education }}"
  - select: "School"
    selector: "#ResumeColumn1"
    value: "{{ app_answers.school }}"
  # Valid values: "Bachelor Of Science" | "Master Of Science - M S" | "Master Of Arts" |
  # "Doctor Of Philosophy  - D Phil" | "Bachelor Of Arts" | "Associate Of Arts" | etc.
  - select: "Degree"
    selector: "#ResumeColumn2"
    value: "{{ app_answers.degree }}"
  # Use exact option text. Common values: "No License/Cert" | "N/A" |
  # "Council of Clin Research Coord(30143)" | "Basic Life Support Cert(30017)" | etc.
  - select: "License & Certs"
    selector: "#ResumeColumn3"
    value: "{{ answers.license_cert }}"
  - fill: "Desired Salary"
    selector: "#Salary"
    value: "{{ app_answers.desired_salary }}"
  - pick:
      field: "Were you ever an employee or a volunteer at"
      as: select
      source: answers.previously_employed_by_nyulangone
      map: { true: "Yes", false: "No" }
    selector: "#ResumeColumn6"
  - fill: "If yes on question above, please list facility and dates worked."
    selector: "#ResumeColumn10"
    value: "{{ answers.previously_employed_by_nyulangone_details }}"
    when: "answers.previously_employed_by_nyulangone == true"
  - fill: "If yes on question above, please list facility and dates worked."
    selector: "#ResumeColumn10"
    value: "N/A"
    when: "answers.previously_employed_by_nyulangone == false"
  - click: "NEXT"

  # --- profile attachments upload -----------------------------------------------------
  - upload: "Attachment 1"
    selector: "#Attachment_1"
    value: "{{ documents.cover_letter_path_or_url }}"
    optional: true

  - click: "NEXT"

  # --- assessment notice -----------------------------------------------------
  - click: "NEXT"

  # --- gender/race/disability/veteran -----------------------------------------------------
  - pick:
      group: "What is your gender?"
      scope: 'input[type=radio][name="GenderPlus"]'
      source: app_answers.gender
      map:
        Male: "Male"
        Female: "Female"
        Non-Binary: "Non-Binary"
      default: "I choose not to self identify"
  - pick:
      group: "What is your race/ethnicity?"
      scope: 'input[type=radio][name="Race"]'
      source: app_answers.race_ethnicity
      map:
        "Hispanic or Latino": "Hispanic or Latino"
        "White": "White (Not Hispanic or Latino)"
        "Black or African American": "Black or African American"
        "Asian": "Asian (Not Hispanic or Latino)"
        "Native Hawaiian or Other Pacific Islander": "Native Hawaiian or Other Pacific Islander"
        "American Indian or Alaskan Native": "American Indian or Alaskan Native"
        "Two or More Races": "Two or More Races"
      default: "I choose not to self identify"
  - fill: "Name"
    selector: "#OfccpDisabilityForm_Name"
    value: "{{ person_name.legal_name.first }} {{ person_name.legal_name.last }}"
  - fill: "Date"
    selector: "#OfccpDisabilityForm_Date"
    value: "{{ builtins.today }}"
  - fill: "Employee ID"
    selector: "#OfccpDisabilityForm_EmployeeId"
    value: "{{ answers.nyulangone_employee_id }}"
    optional: true
    when: "answers.previously_employed_by_nyulangone == true"
  - pick:
      group: "Please check one of the boxes below:"
      scope: 'input[type=radio][name="OfccpDisabilityForm_Status"]'
      source: detailed_personal_info.disability_status.value
      map:
        "yes": "Yes, I have a disability, or have had one in the past"
        "no": "No, I do not have a disability and have not had one in the past"
      default: "I do not want to answer"
  - pick:
      group: "Pre-Offer Invitation to Self-Identify as a Protected Veteran"
      scope: 'input[type=radio][name="VeteranStatus"]'
      source: app_answers.is_veteran
      map:
        true: "I Identify As One Or More Of The Classifications Of Protected Veteran Listed Above"
        false: "I Am Not a Protected Veteran"
      default: "I choose not to self identify"

  # --- captcha and submit -----------------------------------------------------
  # Browser must be visible (no --headless). Complete the reCAPTCHA manually
  # during the pause. Final submission remains manual.
  - sleep: 120
