version: 1
name: "UTHealth Taleo Application"
job_id: "260000AU"
url: "https://uth.taleo.net/careersection/jobapply.ftl?job=260000AU"

# Template paths reference the applicant data file (see applicants/example.json):
#   person_name.*, address_and_contact.*, emails.*, documents.* come from the
#   rich profile; site-specific answers live under `answers.*`; the Taleo login
#   lives under `account.*`; `builtins.today` is supplied by the runner.

steps:
  # --- create an account -------------------------------------------------
  - click: "New User"

  - fill: "User Name"
    selector: "#dialogTemplate-dialogForm-userName"
    value: "{{ account.user_name }}"
  - fill: "Password"
    selector: "#dialogTemplate-dialogForm-password"
    value: "{{ account.password }}"
  - fill: "Re-enter Password"
    selector: "#dialogTemplate-dialogForm-passwordConfirm"
    value: "{{ account.password }}"
  - fill: "Email Address"
    selector: "#dialogTemplate-dialogForm-email"
    value: "{{ account.email }}"
  - click: "Register"
    selector: "#dialogTemplate-dialogForm-defaultCmd"

  # --- resume upload -----------------------------------------------------
  - check: "Select the resume/CV file to upload"
    optional: true
  # Taleo's file input has a volatile JSF id prefix but a stable suffix; match
  # on the suffix so it keeps working across sessions. (The visible "Choose
  # File" text is the browser's native rendering of this input, not a button.)
  - upload: "Resume/CV"
    selector: 'input[type=file][id$="ResumeUploadInputFile"]'
    value: "{{ documents.resume_path_or_url }}"
  - click: "Save and Continue"

  # --- source tracking ---------------------------------------------------
  - select: "Source Type"
    value: "UTHealth Career Site"
  - select: "UTHealth Career Site"
    value: "Career Section"

  # --- personal information ---------------------------------------------
  - fill: "Legal First Name"
    value: "{{ person_name.legal_name.first }}"
  - fill: "Legal Last Name"
    value: "{{ person_name.legal_name.last }}"
  - fill: "Street Address (line 1)"
    value: "{{ address_and_contact.primary_address.line_1 }}"
  - fill: "City"
    value: "{{ address_and_contact.primary_address.city }}"
  - fill: "Zip/Postal Code"
    value: "{{ address_and_contact.primary_address.postal_code }}"

  - select: "Country"
    value: "{{ address_and_contact.primary_address.country }}"
  - select: "State/Province"
    value: "{{ address_and_contact.primary_address.state_province }}"
  - select: "Region"
    value: "{{ answers.region }}"

  - select: "Primary Number"
    value: "Cellular Phone"
  - fill: "Cellular Number"
    value: "{{ address_and_contact.phone_numbers.mobile }}"
  - fill: "Email Address"
    value: "{{ emails.institution_email }}"

  # Yes/No questions driven by booleans in the profile/answers.
  - pick:
      field: "Will you now or in the future require sponsorship for employment visa status (e.g., H-1B, TN, etc.)?"
      as: select
      source: detailed_personal_info.birth_and_citizenship.requires_visa_sponsorship
      map: { true: "Yes", false: "No" }

  - pick:
      field: "Are you related by blood or marriage to any employee of UTHealth or UT System Board of Regents?"
      as: select
      source: answers.related_to_uthealth_employee
      map: { true: "Yes", false: "No" }

  - pick:
      field: "Have you ever been or are you currently employed by UTHealth?"
      as: select
      source: answers.previously_employed_by_uthealth
      map: { true: "Yes", false: "No" }

  - click: "Save and Continue"
  - click: "Save and Continue"

  # --- voluntary demographics --------------------------------------------
  # These are unlabeled "diversityBlock" selects; the questions are 0=Gender,
  # 1=Hispanic/Latino, 2=Race, 3=Protected Veteran (stable id suffix order).
  - select: "Gender"
    selector: 'select[id*="diversityBlock"][id$="-0-questionSingleList"]'
    value: "{{ answers.gender }}"
  - select: "Hispanic or Latino"
    selector: 'select[id*="diversityBlock"][id$="-1-questionSingleList"]'
    value: "{{ answers.is_hispanic_or_latino }}"
  - select: "Race / ethnicity"
    selector: 'select[id*="diversityBlock"][id$="-2-questionSingleList"]'
    value: "{{ answers.ethnicity }}"
  - select: "Protected Veteran"
    selector: 'select[id*="diversityBlock"][id$="-3-questionSingleList"]'
    value: "{{ answers.protected_veteran }}"
  - click: "Save and Continue"

  # --- disability self-identification (CC-305) ---------------------------
  - fill: "Name:"
    value: "{{ person_name.legal_name.first }} {{ person_name.legal_name.last }}"
  - fill: "Date:"
    value: "{{ builtins.today }}"
  - pick:
      as: check
      source: detailed_personal_info.disability_status.value
      map:
        true: "Yes, I have a disability, or have had one in the past"
        false: "No, I do not have a disability and have not had one in the past"
      default: "I do not want to answer"
  - click: "Save and Continue"

  # --- protected-veteran / Texas questions (tri-state Yes/No/decline) -----
  # These are 5 mandatory radio groups (B-F) with identical Yes/No/decline
  # options; they're told apart only by the group name suffix -0-qr .. -4-qr.
  - pick:                                   # 1. B. veteran with a disability
      scope: 'input[type=radio][name$="-0-qr"]'
      source: answers.veteran_with_disability
      map: { true: "Yes", false: "No" }
      default: "I do not wish to provide this information"
  - pick:                                   # 2. C. surviving spouse of a veteran
      scope: 'input[type=radio][name$="-1-qr"]'
      source: answers.surviving_spouse_of_veteran
      map: { true: "Yes", false: "No" }
      default: "I do not wish to provide this information"
  - pick:                                   # 3. D. orphan of a veteran
      scope: 'input[type=radio][name$="-2-qr"]'
      source: answers.orphan_of_veteran
      map: { true: "Yes", false: "No" }
      default: "I do not wish to provide this information"
  - pick:                                   # 4. E. former foster child
      scope: 'input[type=radio][name$="-3-qr"]'
      source: answers.former_foster_child
      map: { true: "Yes", false: "No" }
      default: "I do not wish to provide this information"
  - pick:                                   # 5. F. I identify as a Veteran
      scope: 'input[type=radio][name$="-4-qr"]'
      source: answers.is_veteran
      map: { true: "Yes", false: "No" }
      default: "I do not wish to provide this information"
  - click: "Save and Continue"

  # --- e-signature & submit ---------------------------------------------
  # - fill: "Please enter your full name:"
  #   value: "{{ person_name.legal_name.first }} {{ person_name.legal_name.last }}"
  # - click: "Save and Continue"
  # - click: "Submit"
