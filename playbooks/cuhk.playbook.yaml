version: 1
name: "CUHK-Shenzhen Academic Recruitment Application"
job_id: "735"
employer_key: "cuhk"
url: "https://jobs.cuhk.edu.cn/jobDetails?id=735&channel=SDS4"

# =============================================================================
# CUHK-SHENZHEN ACADEMIC RECRUITMENT SYSTEM — job 735, channel SDS4
# -----------------------------------------------------------------------------
# jobs.cuhk.edu.cn is a JavaScript-rendered recruitment portal. The public HTML
# shell does not expose the real form fields, so this playbook should be built
# from live tools/form-extractor.js output, one page/state at a time.
#
# Authoring workflow for this file:
#   1. Open the job detail URL above.
#   2. Paste tools/form-extractor.js into DevTools Console.
#   3. Paste each output back into the chat with a page label, e.g.
#        "Page 1: job detail page before clicking Apply"
#        "Page 2: login/register page"
#        "Page 3: profile page after selecting Yes for visa sponsorship"
#   4. I will replace the TODO blocks below with confirmed selectors/steps.
#
# Keep final submission disabled until the completed application has been
# reviewed by a human.
# =============================================================================

steps:
  # --- job detail page --------------------------------------------------------
  # Explicit open: future sections may need additional `open:` steps, and the
  # runner disables automatic `url:` navigation whenever any explicit open exists.
  - open: "https://jobs.cuhk.edu.cn/jobDetails?id=735&channel=SDS4"
    wait_after: 2

  # Confirmed via form-extractor on 2026-06-13.
  - click: "APPLY NOW"
    selector: "xpath=(//*[self::button or self::a or @role='button'][contains(normalize-space(.), \"APPLY NOW\")])[1]"
    wait_after: 2

  # --- create a fresh account, then sign in -----------------------------------
  # login?redirect=/postRegistration?id=735 — login page confirmed via
  # form-extractor on 2026-06-13. CUHK's "Create Account" mode is a plain link
  # that reveals the registration fields in-place; the current extractor reports
  # it as a likely reveal/modal trigger.
  #
  # Registration sends an email verification code. Configure IMAP before running:
  #   export IMAP_USER="your real inbox, e.g. name@gmail.com"
  #   export IMAP_PASSWORD="<app password>"
  #   # IMAP_HOST defaults to imap.gmail.com
  #
  # Use {{ account.email }} here, not {{ emails.institution_email }}, so every
  # run gets a fresh collision-free account identity.
  - click: "New user? Create an account"
    selector: "xpath=(//*[self::button or self::a or @role='button'][contains(normalize-space(.), \"New user? Create an account\")])[1]"
    wait_after: 1
  - fill: "Email"
    selector: 'input[placeholder="Email"]'
    value: "{{ account.email }}"
  - click: "Get Code"
    selector: "xpath=//a[normalize-space()='Get Code']"
    wait_after: 1
  - await_email_code:
      field: "Verification Code"
      to: "{{ account.email }}"
      code_pattern: '\b([0-9]{4,8})\b'
      timeout: 240
      poll: 5
    selector: 'xpath=//label[contains(normalize-space(.), "Verification Code")]/following::input[@type="text"][1]'
  - fill: "Password"
    selector: 'input[placeholder="Password"]'
    value: "{{ account.password }}"
  - fill: "Password Confirmation"
    selector: 'input[placeholder="Password Confirmation"]'
    value: "{{ account.password }}"
  # The extractor sees the backing checkbox as hidden input[name="yse"]; click
  # the visible Element UI label so Playwright has an actionable target.
  - click: "I agree with the Privacy Statement"
    selector: "label.el-checkbox"
  - click: "Create Account"
    selector: "xpath=//button[.//span[normalize-space()='Create Account']]"
    wait_after: 3

  # Successful registration returns to the sign-in form.
  - fill: "Email"
    selector: 'input[placeholder="Email"]'
    value: "{{ account.email }}"
  - fill: "Password"
    selector: 'input[placeholder="Password"]'
    value: "{{ account.password }}"
  - click: "Sign in"
    selector: "xpath=(//*[self::button or self::a or @role='button'][contains(normalize-space(.), \"Sign in\")])[1]"
    wait_after: 3

  # --- applicant profile / application pages ---------------------------------
  # postRegistration page confirmed via form-extractor on 2026-06-13. This page
  # uses Element UI custom selects; `press` focuses the backing input, opens the
  # dropdown with ArrowDown, types the option text, then confirms with Enter.
  - wait_for: "Applied Division"
    selector: 'xpath=//label[normalize-space(.)="Applied Division"]'

  # Job preferences. "Applied Employment Type" is disabled/pre-filled by CUHK.
  - press: "Applied Division"
    selector: 'xpath=//label[normalize-space(.)="Applied Division"]/following::input[@type="text"][1]'
    value: "ArrowDown, {{ answers.cuhk_applied_division }}, Enter"
  - press: "Applied Class of Appointment"
    selector: 'xpath=//label[normalize-space(.)="Applied Class of Appointment"]/following::input[@type="text"][1]'
    value: "ArrowDown, {{ answers.cuhk_applied_class_of_appointment }}, Enter"
  - press: "Applied Position"
    selector: 'xpath=//label[normalize-space(.)="Applied Position"]/following::input[@type="text"][1]'
    value: "ArrowDown, {{ answers.cuhk_applied_position }}, Enter"

  # Personal information.
  - fill: "First Name"
    selector: 'xpath=//label[normalize-space(.)="First Name"]/following::input[@type="text"][1]'
    value: "{{ person_name.legal_name.first }}"
  - fill: "Middle Name"
    selector: 'xpath=//label[normalize-space(.)="Middle Name"]/following::input[@type="text"][1]'
    value: "{{ person_name.legal_name.middle }}"
    when: 'person_name.legal_name.middle != "" and person_name.legal_name.middle != null'
  - fill: "Last Name"
    selector: 'xpath=//label[normalize-space(.)="Last Name"]/following::input[@type="text"][1]'
    value: "{{ person_name.legal_name.last }}"
  - fill: "Date of Birth"
    selector: 'xpath=//label[normalize-space(.)="Date of Birth"]/following::input[@type="text"][1]'
    value: "{{ detailed_personal_info.date_of_birth }}"
  - fill: "Chinese Name"
    selector: 'xpath=//label[normalize-space(.)="Chinese Name"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_chinese_name }}"
    when: 'answers.cuhk_chinese_name != "" and answers.cuhk_chinese_name != null'
  - press: "Title"
    selector: 'xpath=//label[normalize-space(.)="Title"]/following::input[@type="text"][1]'
    value: "ArrowDown, {{ person_name.legal_name.prefix }}, Enter"
  - press: "Type of ID"
    selector: 'xpath=//label[normalize-space(.)="Type of ID & ID No"]/following::input[@type="text"][1]'
    value: "ArrowDown, {{ answers.cuhk_id_type }}, Enter"
  - fill: "Other ID Type"
    selector: 'input[placeholder="(Please Specify)"]'
    value: "{{ answers.cuhk_id_type_other }}"
    when: 'answers.cuhk_id_type == "Other"'
  - fill: "ID No"
    selector: 'xpath=(//label[normalize-space(.)="Type of ID & ID No"]/following::input[@type="text"])[2]'
    value: "{{ answers.cuhk_id_number }}"
  - press: "Country/Region of Citizenship"
    selector: 'xpath=//label[normalize-space(.)="Country/Region of Citizenship"]/following::input[@type="text"][1]'
    value: "ArrowDown, {{ detailed_personal_info.birth_and_citizenship.citizenship_country }}, Enter"

  # Contact and availability.
  - fill: "Mobile"
    selector: 'xpath=//label[normalize-space(.)="Mobile"]/following::input[@type="text"][1]'
    value: "{{ address_and_contact.phone_numbers.mobile }}"
  - fill: "Telephone No.(Home)"
    selector: 'xpath=//label[normalize-space(.)="Telephone No.(Home)"]/following::input[@type="text"][1]'
    value: "{{ address_and_contact.phone_numbers.home }}"
    when: 'address_and_contact.phone_numbers.home != "" and address_and_contact.phone_numbers.home != null'
  - fill: "Telephone No.(Office)"
    selector: 'xpath=//label[normalize-space(.)="Telephone No.(Office)"]/following::input[@type="text"][1]'
    value: "{{ address_and_contact.phone_numbers.work }}"
    when: 'address_and_contact.phone_numbers.work != "" and address_and_contact.phone_numbers.work != null'
  - fill: "City of Residence"
    selector: 'xpath=//label[normalize-space(.)="City of Residence"]/following::input[@type="text"][1]'
    value: "{{ address_and_contact.primary_address.city }}"
  - fill: "Earliest Date Available if Appointed"
    selector: 'xpath=//label[normalize-space(.)="Earliest Date Available if Appointed"]/following::input[@type="text"][1]'
    value: "{{ employment_basics.availability_to_start }}"
  - fill: "Research Interest"
    selector: 'xpath=//label[normalize-space(.)="Research Interest"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_research_interest }}"
  - fill: "Correspondence Address"
    selector: 'xpath=//label[normalize-space(.)="Correspondence Address"]/following::input[@type="text"][1]'
    value: "{{ address_and_contact.primary_address.line_1 }} {{ address_and_contact.primary_address.line_2 }}, {{ address_and_contact.primary_address.city }}, {{ address_and_contact.primary_address.state_province }} {{ address_and_contact.primary_address.postal_code }}, {{ address_and_contact.primary_address.country }}"

  # Emergency contact.
  - fill: "Emergency Contact Name"
    selector: 'xpath=//label[normalize-space(.)="Emergency Contact Name"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_emergency_contact_name }}"
  - fill: "Relationship to Applicant"
    selector: 'xpath=//label[normalize-space(.)="Relationship to Applicant"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_emergency_contact_relationship }}"
  - fill: "Emergency Contact Number"
    selector: 'xpath=//label[normalize-space(.)="Emergency Contact Number"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_emergency_contact_number }}"
  - fill: "Emergency Contact Address"
    selector: 'xpath=//label[normalize-space(.)="Emergency Contact Address"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_emergency_contact_address }}"

  # Education, first row. The `Country/Region` and `Start Date` labels repeat
  # later in work history, so these selectors intentionally take the first match.
  - press: "Degree"
    selector: 'xpath=(//label[normalize-space(.)="Degree"]/following::input[@type="text"][1])[1]'
    value: "ArrowDown, {{ answers.cuhk_degree }}, Enter"
  - fill: "Major Subject / Field of Study"
    selector: 'xpath=//label[normalize-space(.)="Major Subject / Field of Study"]/following::input[@type="text"][1]'
    value: "{{ education.schools.0.major }}"
  - fill: "Institution"
    selector: 'xpath=//label[normalize-space(.)="Institution"]/following::input[@type="text"][1]'
    value: "{{ education.schools.0.institution }}"
  - press: "Education Country/Region"
    selector: 'xpath=(//label[normalize-space(.)="Country/Region"]/following::input[@type="text"][1])[1]'
    value: "ArrowDown, {{ education.schools.0.country }}, Enter"
  - fill: "Education Start Date"
    selector: 'xpath=(//label[normalize-space(.)="Start Date"]/following::input[@type="text"][1])[1]'
    value: "{{ education.schools.0.start_date }}"
  - fill: "Graduation/Anticipated Date"
    selector: 'xpath=//label[normalize-space(.)="Graduation/Anticipated Date"]/following::input[@type="text"][1]'
    value: "{{ education.schools.0.graduation_date }}"

  # Work history, first row. The page has Add/Delete controls for additional
  # rows; this first pass fills only the primary/current position.
  - fill: "Position"
    selector: 'input[placeholder="Please enter the job title or position (e.g., Assistant Professor)"]'
    value: "{{ work_history.0.job_title }}"
  - fill: "Employer"
    selector: 'xpath=//label[normalize-space(.)="Employer"]/following::input[@type="text"][1]'
    value: "{{ work_history.0.company }}"
  - press: "Type of Employment"
    selector: 'xpath=//label[normalize-space(.)="Type of Employment"]/following::input[@type="text"][1]'
    value: "ArrowDown, {{ answers.cuhk_type_of_employment }}, Enter"
  - fill: "Nature of Work"
    selector: 'input[placeholder="Please describe the main responsibilities (e.g., teaching, research, etc)"]'
    value: "{{ work_history.0.responsibilities }}"
  - press: "Work Country/Region"
    selector: 'xpath=(//label[normalize-space(.)="Country/Region"]/following::input[@type="text"][1])[2]'
    value: "ArrowDown, {{ work_history.0.country }}, Enter"
  - fill: "City"
    selector: 'xpath=//label[normalize-space(.)="City"]/following::input[@type="text"][1]'
    value: "{{ work_history.0.city }}"
  - fill: "Work Start Date"
    selector: 'xpath=(//label[normalize-space(.)="Start Date"]/following::input[@type="text"][1])[2]'
    value: "{{ work_history.0.start_date }}"
  - fill: "End Date"
    selector: 'xpath=//label[normalize-space(.)="End Date"]/following::input[@type="text"][1]'
    value: "{{ work_history.0.end_date }}"
    when: 'work_history.0.end_date != "" and work_history.0.end_date != null'
  - click: "Next"
    selector: "xpath=(//*[self::button or self::a or @role='button'][contains(normalize-space(.), \"Next\")])[1]"
    wait_after: 2

  # --- publications / creative works -----------------------------------------
  # Confirmed via form-extractor on 2026-06-13 after the first application page.
  # The only captured dropdown options were for Publication Type:
  # Journal Article | Book | Book Chapter | Conference Paper | Other.
  - wait_for: "Publication Type"
    selector: 'xpath=//label[normalize-space(.)="Publication Type"]'
  - press: "Publication Type"
    selector: 'xpath=//label[normalize-space(.)="Publication Type"]/following::input[@type="text"][1]'
    value: "ArrowDown, {{ answers.cuhk_publication_type }}, Enter"
  - fill: "Type of Work"
    selector: 'xpath=//label[normalize-space(.)="Type of Work"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_publication_work_type }}"
  - fill: "Publication Title"
    selector: 'xpath=//label[normalize-space(.)="Title"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_publication_title }}"
  - fill: "Author(s)/Creator(s)"
    selector: 'xpath=//label[normalize-space(.)="Author(s)/Creator(s)"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_publication_authors }}"
  - fill: "Target Journal/ Publisher/ Conference"
    selector: 'xpath=//label[normalize-space(.)="Target Journal/ Publisher/ Conference"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_publication_venue }}"
  - fill: "Current Status"
    selector: 'xpath=//label[normalize-space(.)="Current Status"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_publication_status }}"
  - fill: "Description"
    selector: 'xpath=//label[normalize-space(.)="Description"]/following::input[@type="text"][1]'
    value: "{{ answers.cuhk_publication_description }}"
  - click: "Next"
    selector: "xpath=(//*[self::button or self::a or @role='button'][contains(normalize-space(.), \"Next\")])[1]"
    wait_after: 2

  # --- documents --------------------------------------------------------------
  # TODO: replace with extractor-confirmed upload fields.
  #
  # Common academic application document paths:
  #   {{ documents.resume_path_or_url }}
  #   {{ documents.cover_letter_path_or_url }}
  #   {{ documents.research_statement_path }}
  #   {{ documents.teaching_statement_path }}
  #   {{ documents.teaching_evaluations_path }}
  #   {{ documents.references_path }}
  #   {{ documents.additional_attachment_path }}

  # --- review & submit --------------------------------------------------------
