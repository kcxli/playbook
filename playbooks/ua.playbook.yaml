version: 1
name: "University of Alabama — Assistant Professor, Probability/Mathematical Statistics (Mathematics)"
job_id: "527499"
employer_key: "ua"
url: "https://careers.ua.edu/jobs/bcas-assistant-professor-in-probability-or-mathematical-statistics-in-mathematics-527499-tuscaloosa-alabama-united-states"

# =============================================================================
# UNIVERSITY OF ALABAMA CAREERS — PageUp People applicant flow (job 527499)
# -----------------------------------------------------------------------------
# careers.ua.edu runs on PageUp. The application form is JavaScript-rendered and
# sits behind a sign-in/registration step, so its field selectors could NOT be
# read server-side — they must come from the FORM EXTRACTOR run live in the
# browser. The selectors marked `# TODO from extractor` below are placeholders;
# replace each with the real selector from tools/form-extractor.js output.
#
# HOW TO FILL THIS IN (same workflow as the UMN/UCI playbooks):
#   1. Open the job page, click "Apply", and sign in / register an account.
#   2. On EACH application page, paste the bookmarklet at the bottom of
#      tools/form-extractor.js into the DevTools Console (F12 → Console).
#   3. Paste the printed output back to Claude; Claude swaps the TODO selectors
#      for the real ids and fixes button text to match the live page.
#   4. Run NON-headless with --slow-mo 400 first to watch it through.
#
# Typical PageUp apply flow (refine against the extractor output):
#   job page → Apply → sign in/register → personal details → questionnaire →
#   document uploads → EEO/voluntary self-id → review → submit.
#
# Required materials (math faculty search — confirm on the live posting):
#   CV, cover letter, research statement, teaching statement, references.
# =============================================================================

steps:
  # --- job posting page — quick-apply panel (name + email) --------------------
  # PageUp shows an inline "apply" panel on the job listing page. Fill the three
  # fields and click APPLY; PageUp then redirects to the full application.
  # (Selectors confirmed via form-extractor on the live page, 2026-06-12.)
  - open: "https://careers.ua.edu/jobs/bcas-assistant-professor-in-probability-or-mathematical-statistics-in-mathematics-527499-tuscaloosa-alabama-united-states#apply"
    wait_after: 2
  - fill: "First Name (required)"
    selector: "#form_first_name_4_0_0"
    value: "{{ person_name.legal_name.first }}"
  - fill: "Last Name (required)"
    selector: "#form_last_name_4_0_1"
    value: "{{ person_name.legal_name.last }}"
  - fill: "Email (required)"
    selector: "#form_email_4_0_2"
    value: "{{ emails.institution_email }}"
  # Cookie consent modal is timing/session dependent — dismiss if present.
  - click: "I ACCEPT"
    optional: true
    wait_after: 1
  - click: "APPLY"
    selector: "#form_submit_4_0"
    wait_after: 3

  # --- PageUp "Begin application" page ---------------------------------------
  # secure.dc4.pageuppeople.com — enter email + accept privacy policy, click Next.
  # (Selectors confirmed via form-extractor, 2026-06-12.)
  - fill: "Email address:"
    selector: "#sEmail"
    value: "{{ emails.institution_email }}"
  - check: "By continuing, you agree that you have read our Privacy Statement"
    selector: "#checkagree"
  - click: "Next"
    selector: "#button_next"
    wait_after: 3

  # --- "Save time on your application" — skip pre-fill, go straight to form --
  - click: "Continue with application"
    selector: "#continue"
    wait_after: 3

  # --- Personal details page --------------------------------------------------
  # personalDetails.asp — confirmed via form-extractor 2026-06-12.
  # All `-edit` suffix fields are PageUp combobox inputs — NOT <select> elements.
  # Pattern: press the field, type the value to filter, then ArrowDown+Enter to pick.
  - press: "Title:*"
    selector: "#sTitle-edit"
    value: "{{ answers.ua_title }}, ArrowDown, Enter"
  - fill: "Legal First Name:*"
    selector: "#sFName"
    value: "{{ person_name.legal_name.first }}"
  - fill: "Legal Middle Name:"
    selector: "#sMName"
    value: "{{ person_name.legal_name.middle }}"
    optional: true
  - fill: "Legal Last Name:*"
    selector: "#sLName"
    value: "{{ person_name.legal_name.last }}"
  - fill: "Preferred name:"
    selector: "#sPrefName"
    value: "{{ person_name.preferred_name.preferred_first }}"
    optional: true
  - fill: "Email address:*"
    selector: "#sEmail"
    value: "{{ emails.institution_email }}"
    optional: true
  - fill: "Home address:*"
    selector: "[id$='sStreet1']"
    value: "{{ address_and_contact.primary_address.line_1 }}"
  - fill: "Home address line two:"
    selector: "[id$='sStreet2']"
    value: "{{ address_and_contact.primary_address.line_2 }}"
    optional: true
  - fill: "City:*"
    selector: "#sSuburb"
    value: "{{ address_and_contact.primary_address.city }}"
  # Country pre-fills to "United States" — leave it. Just set State.
  - press: "State / District:*"
    selector: "#sState-edit"
    value: "{{ address_and_contact.primary_address.state_province }}"
    wait_after: 0.5
  - click: "{{ address_and_contact.primary_address.state_province }}"
    selector: "xpath=//*[@id='sState-list']//li[normalize-space(text())='{{ address_and_contact.primary_address.state_province }}']"
    wait_after: 0.5
  - fill: "Zip Code:"
    selector: "#sPostcode"
    value: "{{ address_and_contact.primary_address.postal_code }}"
    optional: true
  - fill: "Phone number:*"
    selector: "#sPhone1"
    value: "{{ address_and_contact.phone_numbers.mobile }}"
  - fill: "Cell number:"
    selector: "#sPhone2"
    value: "{{ address_and_contact.phone_numbers.mobile }}"
    optional: true
  - press: "The University of Alabama employment status:*"
    selector: "#lLKP_NominatedEmploymentStatusID-edit"
    value: "{{ answers.ua_employment_status }}, ArrowDown, Enter"
  - fill: "If you are a current employee please indicate your department of employment and your current job title:"
    selector: "#sOther1"
    value: "{{ answers.ua_current_dept_and_title }}"
    optional: true
  - click: "Save and continue"
    selector: "#button_saveContinue"
    wait_after: 5

  # --- Personal Information page (questionnaire) -----------------------------
  # checkForm.asp — confirmed via form-extractor 2026-06-12.
  # All -edit fields are PageUp dropdowns (Yes/No unless noted).
  - press: "Are you currently authorized to work in the United States?*"
    selector: "#q31516-edit"
    value: "{{ answers.authorized_to_work_us_label }}, ArrowDown, Enter"
  - press: "Is your age 16 or over?*"
    selector: "#q31520-edit"
    value: "Yes, ArrowDown, Enter"
  - press: "Do you have family members who are currently employed by The University of Alabama*"
    selector: "#q31521-edit"
    value: "{{ answers.ua_has_family_employee }}, ArrowDown, Enter"
  # Conditional: only appears when family member answer is "Yes"
  - fill: "If yes, please list the relative's name, position title, and department:*"
    selector: "TODO"   # textarea — run extractor with Yes selected to get selector
    value: "{{ answers.ua_family_member_details }}"
    when: 'answers.ua_has_family_employee == "Yes"'
    optional: true
  - fill: "If you are a current or previous employee, please list your CWID (if known):"
    selector: "#q31515"
    value: ""
    optional: true
  - click: "Continue"
    selector: "#saveContinue"
    wait_after: 3

  # --- Education page ---------------------------------------------------------
  # checkForm.asp (Education) — confirmed via form-extractor 2026-06-12.
  # All comboboxes on this page have role="combobox"; positional XPath on that
  # attribute is stable regardless of volatile id prefixes. Initial page has 6
  # comboboxes (3 edu-type rows + 3 employer-status rows). Selecting edu row 1
  # type inserts 3 new comboboxes inline (Degree type [2], Country [3], Edu
  # status [4]), shifting Employer status to position [7].

  # --- Education row 1 -------------------------------------------------------
  - press: "Type of education:*"
    selector: "xpath=(//input[@role='combobox'])[1]"
    value: "{{ answers.ua_education_type }}, ArrowDown, Enter"
    wait_after: 1

  - press: "Degree type:*"
    selector: "xpath=(//input[@role='combobox'])[2]"
    value: "{{ answers.ua_degree_type }}, ArrowDown, Enter"
    wait_after: 1

  # Major opens a "Search - Major" popup window (SearchDialog.aspx).
  # The popup contains a search text box + a <select> with ALL majors listed.
  # Flow: click the field → popup opens → fill search → click Search →
  # select from the results dropdown → click Select.
  - click: "Major search button"
    selector: "xpath=//input[@id='major_1Text']/following::*[self::a or self::button or (self::input and (@type='button' or @type='image'))][1]"
    wait_after: 1
  - search_dialog: "Major"
    value: "{{ answers.major }}"
    wait_after: 1

  - fill: "Additional majors:"
    selector: "input[id$='additionalMajors_1']"
    value: ""
    optional: true

  - press: "Country:*"
    selector: "xpath=//*[normalize-space()='Country:*']/following::input[@role='combobox'][1]"
    value: "{{ address_and_contact.primary_address.country }}, Tab"
    wait_after: 2

  - click: "Institution search button"
    selector: "xpath=//*[normalize-space()='Institution:*']/following::*[self::a or self::button or (self::input and (@type='button' or @type='image'))][1]"
    wait_after: 1
  - search_dialog: "Institution"
    value: "{{ answers.school }}"
    wait_after: 1

  - press: "Education status:*"
    selector: "xpath=//*[normalize-space()='Education status:*']/following::input[@role='combobox'][1]"
    value: "{{ answers.ua_education_status }}, Tab"
    wait_after: 1

  - fill: "Year started:"
    selector: "input[id$='yearStarted_1']"
    value: "{{ answers.ua_degree_year_started }}"
    optional: true

  - fill: "Year finished (actual or anticipated):"
    selector: "input[id$='yearEnded_1']"
    value: "{{ answers.degree_year_acquired }}"
    optional: true

  # --- Employment row 1 ------------------------------------------------------
  # Confirmed via form-extractor 2026-06-12 (both "Currently employed" and
  # "Previous employer" states captured). Fields marked ⚠ use volatile id
  # suffixes; stable ids noted where available.
  - press: "Employer status:*"
    selector: "xpath=//*[normalize-space()='Employer status:*']/following::input[@role='combobox'][1]"
    value: "{{ answers.ua_employer_status }}, Tab"
    wait_after: 1

  - fill: "Your job title:*"
    selector: "#role_1"
    value: "{{ answers.current_title }}"

  # Start date — month/year dropdowns with volatile ids; only one pair on page
  # when "Currently employed" (end date absent), so position is unambiguous.
  - press: "Month"
    selector: "xpath=//*[normalize-space()='Date started with company:*']/following::input[@role='combobox'][1]"
    value: "{{ answers.ua_start_month }}, Tab"
    optional: true

  - press: "Year"
    selector: "xpath=//*[normalize-space()='Date started with company:*']/following::input[@role='combobox'][2]"
    value: "{{ answers.ua_start_year }}, Tab"
    optional: true

  # Company name — same popup pattern as Major (SearchDialog.aspx?sSelectType=ProfileCompany).
  # Flow: click field → popup opens → fill search text → Search → select result → Select.
  # ⚠ Popup is a new browser window; same caveats as Major apply.
  - click: "Company name search button"
    selector: "xpath=//*[contains(@id,'companyName_1Text')]/following-sibling::*[self::input or self::button or self::a][1]"
    wait_after: 2
  - search_dialog: "Company name"
    value: "{{ answers.ua_company_name }}"
    optional: true
    wait_after: 1

  - press: "Country you worked in:*"
    selector: "xpath=//*[normalize-space()='Country you worked in:*']/following::input[@role='combobox'][1]"
    value: "{{ address_and_contact.primary_address.country }}, Tab"

  - fill: "Manager's name:*"
    selector: "input[id$='managerName_1']"
    value: "{{ answers.ua_manager_name }}"

  - fill: "Your responsibilities:*"
    selector: "textarea[id$='responsibilities_1']"
    value: "{{ answers.ua_responsibilities }}"

  # End date — stable ids, only present when "Previous employer" selected.
  - press: "Month"
    selector: "#q34343_dEnded_1_month-edit"
    value: "{{ answers.ua_end_month }}, ArrowDown, Enter"
    when: 'answers.ua_employer_status == "Previous employer"'
    optional: true

  - press: "Year"
    selector: "#q34343_dEnded_1_year-edit"
    value: "{{ answers.ua_end_year }}, ArrowDown, Enter"
    when: 'answers.ua_employer_status == "Previous employer"'
    optional: true

  - fill: "Your reason for leaving:*"
    selector: "[id$='reasonLeaving_1']"
    value: "{{ answers.ua_reason_for_leaving }}"
    when: 'answers.ua_employer_status == "Previous employer"'
    optional: true

  # --- Certifications --------------------------------------------------------
  - fill: "Please list any current certifications or additional licenses you have, that support your qualifications for this position. If you do not have any, enter N/A.*"
    selector: "textarea#q33682"
    value: "{{ answers.ua_certifications }}"

  - click: "Continue"
    selector: "#saveContinue"
    wait_after: 3

  # --- Work Experience page ---------------------------------------------------
  # checkForm.asp (Work Experience) — confirmed via form-extractor 2026-06-12.
  # All stable IDs. Day/month are -edit dropdowns; year is a plain text input.
  - fill: "Company Name*"
    selector: "#q34298"
    value: "{{ answers.ua_company_name }}"

  - fill: "Position Title*"
    selector: "#q34299"
    value: "{{ answers.current_title }}"

  - press: "Day"
    selector: "#q34300_day-edit"
    value: "{{ answers.ua_start_day }}, ArrowDown, Enter"
    optional: true

  - press: "Month"
    selector: "#q34300_month-edit"
    value: "{{ answers.ua_start_month }}, ArrowDown, Enter"
    optional: true

  - fill: "[placeholder: Year]"
    selector: "#q34300_year"
    value: "{{ answers.ua_start_year }}"
    optional: true

  - press: "Country Worked In*"
    selector: "#q34301-edit"
    value: "{{ address_and_contact.primary_address.country }}, ArrowDown, Enter"

  - press: "Add Additional Positions*"
    selector: "#q34302-edit"
    value: "{{ answers.ua_add_additional_positions }}, ArrowDown, Enter"

  # "May we contact your current or previous employers?"
  # options: Yes | No | Contact me first
  - pick:
      group: "May we contact your current or previous employers listed in the work history section of the application?*"
      scope: "input[type=radio][name='q34323']"
      source: answers.ua_contact_employers
      map:
        "yes": "Yes"
        "no": "No"
        "ask": "Contact me first"

  - click: "Continue"
    selector: "#saveContinue"
    wait_after: 3

  # --- Criminal History page --------------------------------------------------
  # checkForm.asp (Criminal History) — confirmed via form-extractor 2026-06-12.
  - press: "Have you ever been convicted of a felony?*"
    selector: "#q31496-edit"
    value: "{{ answers.ua_felony_conviction }}, ArrowDown, Enter"
    wait_after: 1
  # Conditional textarea — only appears when "Yes" selected.
  # TODO: run extractor with "Yes" selected to get the real selector.
  - fill: "If yes, please describe the nature and circumstances of the crime.*"
    selector: "TODO"
    value: "{{ answers.ua_felony_description }}"
    when: 'answers.ua_felony_conviction == "Yes"'
    optional: true
  - click: "Continue"
    selector: "#saveContinue"
    wait_after: 3

  # --- Voluntary Demographic Questions page ----------------------------------
  # checkForm.asp (Voluntary Demographic) — confirmed via form-extractor 2026-06-12.
  - pick:
      group: "Gender:"
      scope: "input[type=radio][name='q31489']"
      source: answers.gender
      map:
        Female: "Female"
        Male: "Male"
      default: "Not Disclosed"

  - pick:
      group: "Are you Hispanic or Latino?"
      scope: "input[type=radio][name='q31490']"
      source: answers.is_hispanic_or_latino
      map:
        true: "Yes"
        false: "No"
      default: "Not Disclosed"

  - pick:
      group: "Citizenship:"
      scope: "input[type=radio][name='q31492']"
      source: answers.ua_citizenship_status
      map:
        "citizen": "U.S. Citizen"
        "permanent_resident": "Permanent Resident"
        "non_resident": "Non-resident Alien"
      default: "Not Disclosed"

  # Race checkboxes — check all that apply
  - check: "American Indian/Alaska Native"
    selector: "#q23931"
    when: '"American Indian or Alaska Native" in answers.race_ethnicity'
  - check: "Asian"
    selector: "#q23932"
    when: '"Asian" in answers.race_ethnicity'
  - check: "Black or African American"
    selector: "#q23933"
    when: '"Black or African American" in answers.race_ethnicity'
  - check: "Native Hawaiian or Other Pacific Islander"
    selector: "#q23934"
    when: '"Native Hawaiian or Other Pacific Islander" in answers.race_ethnicity'
  - check: "White"
    selector: "#q23935"
    when: '"White" in answers.race_ethnicity'

  - click: "Continue"
    selector: "#saveContinue"
    wait_after: 3

  # --- Additional Questions page (document uploads) --------------------------
  # checkForm.asp (Additional Questions) — confirmed via form-extractor 2026-06-12.
  - upload: "Research Statement*"
    selector: "#file-upload-0"
    value: "{{ documents.research_statement_path }}"
    wait_after: 2
  - upload: "Statement of teaching philosophy, methods, and plans"
    selector: "#file-upload-1"
    value: "{{ documents.teaching_statement_path }}"
    when: 'documents.teaching_statement_path != ""'
    wait_after: 2
  - click: "Continue"
    selector: "#saveContinue"
    wait_after: 3

  # --- Voluntary Self-Identification of Disability page ----------------------
  # checkForm.asp (Disability) — confirmed via form-extractor 2026-06-12.
  - fill: "Name*"
    selector: "#q31505"
    value: "{{ person_name.legal_name.first }} {{ person_name.legal_name.last }}"
  - fill: "Date*"
    selector: "#q31506"
    value: "{{ builtins.today }}"
  - fill: "Employee ID (if applicable)"
    selector: "#q31501"
    value: ""
    optional: true
  - pick:
      group: "Please check one of the boxes below:*"
      scope: "input[type=radio][name='q31504']"
      source: detailed_personal_info.disability_status.value
      map:
        "yes": "Yes, I have a disability, or have had one in the past"
        "no": "No, I do not have a disability and have not had one in the past"
      default: "I do not want to answer"
  - click: "Continue"
    selector: "#saveContinue"
    wait_after: 3

  # --- Voluntary Self-Identification of Protected Veterans page --------------
  # checkForm.asp (Veterans) — confirmed via form-extractor 2026-06-12.
  - pick:
      group: "Please check one of the boxes below:*"
      scope: "input[type=radio][name='q31510']"
      source: detailed_personal_info.veteran_status.value
      map:
        "yes": "I IDENTIFY AS ONE OR MORE OF THE CLASSIFICATIONS OF PROTECTED VETERANS LISTED ABOVE"
        "no": "I AM NOT A VETERAN"
        "protected_not_qualifying": "I AM NOT A PROTECTED VETERAN"
      default: "I DO NOT WISH TO ANSWER"
  - click: "Continue"
    selector: "#saveContinue"
    wait_after: 3

  # --- Documents + Education review page -------------------------------------
  # This page (after veteran self-ID) combines document uploads with an
  # education section. The education fields are pre-populated from the earlier
  # Education page and do not need to be re-entered. Just upload documents and
  # continue. Confirmed via form-extractor + screenshot, 2026-06-12.
  - upload: "Please upload your cover letter."
    selector: "#file-upload-0"
    value: "{{ documents.cover_letter_path_or_url }}"
    when: 'documents.cover_letter_path_or_url != ""'
    wait_after: 2
  - upload: "Please upload your CV.*"
    selector: "#file-upload-1"
    value: "{{ documents.resume_path_or_url }}"
    wait_after: 2
  - upload: "Provide a list of references with contact information"
    selector: "#file-upload-2"
    value: "{{ documents.references_path }}"
    when: 'documents.references_path != ""'
    wait_after: 2
  - upload: "Additional Document"
    selector: "#file-upload-3"
    value: "{{ documents.additional_attachment_path }}"
    when: 'documents.additional_attachment_path != ""'
    wait_after: 2
  - click: "Continue"
    selector: "#saveContinue"
    wait_after: 3

  # --- Submit application page -----------------------------------------------
  # submitApp.asp — confirmed via form-extractor 2026-06-12.
  # Valid values: "UA Employment Website (jobs.ua.edu)" | "Web-based job posting board" |
  # "Other Website" | "HERC" | "Facebook" | "Twitter" | "LinkedIn" |
  # "Office of Veteran and Military Affairs" | "Other Social Media" |
  # "Newspaper Advertisement" | "Professional Journal" | "Other Print Advertisement" |
  # "Veteran Career Fair" | "UA On-Campus Career Fair" | "State Employment Office" |
  # "Other Career Fair/State Agency" | "Referred by UA Employee" |
  # "Referred by Hiring Department" | "Referred by Human Resources/UA Recruiter" |
  # "Referred by Vocational Rehabilitation" | "Referred by Search Firm" |
  # "Other Referral/Listserv/Email Notification"
  - select: "(unlabeled)"
    selector: "[name='lApplicationSubSourceID']"
    value: "{{ answers.ua_referral_source }}"

  - scroll: "bottom"
    optional: true

  # Intentionally disabled — never submit before a human review.
  # - click: "Submit application"
  #   selector: "#button_submitApplication"
  #   wait_after: 5
